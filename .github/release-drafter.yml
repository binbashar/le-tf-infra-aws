name-template: 'v$RESOLVED_VERSION 🌈'
tag-template: 'v$RESOLVED_VERSION'

# Never reaches the notes. `skip-changelog` is for PRs with no value to whoever
# upgrades, such as the create/update/destroy PRs that exercise `/tofu apply`.
exclude-labels:
  - 'duplicate'
  - 'invalid'
  - 'wontfix'
  - 'WIP'
  - 'skip-changelog'

# A PR lands in EVERY category whose labels it carries, and release-drafter has
# no "first match wins". So categories follow ONE axis, the type of change, and
# a PR carries one type label. `breaking` is the only deliberate exception
# (called out up top, still indexed under its type). Topic labels such as
# `security` are for filtering only and never get a category: in v3.2.0 a
# `security` category listed five PRs twice, on top of their type.
categories:
  - title: '💣 Breaking Changes'
    labels:
      - 'breaking'
  - title: '🚀 Features'
    labels:
      - 'feature'
  - title: '✨ Enhancements'
    labels:
      - 'enhancement'
  - title: '🐛 Bug Fixes'
    labels:
      - 'fix'
      - 'bugfix'
      - 'bug'
  - title: '📝 Documentation'
    labels:
      - 'documentation'
      - 'doc'
  - title: '🔨 Maintenance'
    labels:
      - 'chore'
      - 'maintenance'
      - 'cleanup'
      - 'technical-debt'
  - title: '⚙️ Dependency Updates'
    collapse-after: 5
    labels:
      - 'dependencies'

change-template: '- $TITLE @$AUTHOR (#$NUMBER)'
change-title-escapes: '\<*_&' # You can add # and @ to disable mentions, and add ` to disable code blocks.

# Versioning policy. This is a reference architecture that clients copy, not a
# dependency they pin, so:
# - minor: any `feature` PR. The autolabeler sets it from a `feat:` title, so the
#   version follows the PR titles without anyone picking a semver label.
# - major: ONLY the `major` label, a deliberate human decision. `breaking` is
#   descriptive and only routes a PR to the 💣 section. A release that needs
#   operator action stays a minor and says so in its "Breaking Changes &
#   Upgrade Notes" section (v3.1.0 and v3.2.0 both did).
# - patch: everything else.
# `minor`/`patch` labels are deliberately NOT listed. Dependabot puts them on
# dependency bumps, and in v3.2.0 a `minor` on a test-script bump (#1209) was
# the only thing that made the release a minor despite 29 `feat:` PRs.
version-resolver:
  major:
    labels:
      - 'major'
  minor:
    labels:
      - 'feature'
  default: patch

# Safety net for PRs merged without labels — they used to vanish into the
# uncategorized dump. Conventional-commit prefix wins; a human label still overrides.
# Fork PRs get a read-only token, so autolabeling is skipped there by design.
autolabeler:
  - label: 'breaking'
    title:
      - '/^\w+(\([^)]*\))?!:/'
  - label: 'feature'
    title:
      - '/^feat(\([^)]*\))?!?:/'
  - label: 'fix'
    title:
      - '/^fix(\([^)]*\))?!?:/'
  - label: 'documentation'
    title:
      - '/^docs(\([^)]*\))?!?:/'
  - label: 'enhancement'
    title:
      - '/^(ci|perf|refactor)(\([^)]*\))?!?:/'
  - label: 'chore'
    title:
      - '/^chore(?!\(deps\))(\([^)]*\))?!?:/'
  - label: 'dependencies'
    title:
      - '/^chore\(deps\)/'

template: |
  ## Changes

  $CHANGES

  ## Contributors

  $CONTRIBUTORS

  **Full Changelog**: https://github.com/binbashar/le-tf-infra-aws/compare/$PREVIOUS_TAG...v$RESOLVED_VERSION
