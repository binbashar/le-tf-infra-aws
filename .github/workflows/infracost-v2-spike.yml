name: Costs | infracost v2 spike
# TEMPORARY (#1293): does diff@v5 accept an empty base project list (a PR that only adds
# layers), or does it fall back to auto-detecting the whole base checkout?
# Deleted before the PR leaves draft.
on:
  pull_request:
    branches: [master]

permissions:
  contents: read
  pull-requests: write

jobs:
  empty-base:
    name: diff@v5 with an empty base config
    if: ${{ github.head_ref == '1293-infracost-improvement' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
          persist-credentials: false
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          path: head
          persist-credentials: false
      - name: Empty base, one-layer head
        working-directory: head
        env:
          PYTHONPATH: '@bin/scripts'
        run: |
          python3 -m infracost_ci --schema 0.3 config --layer shared/us-east-1/tools-vpn-server --out ../head.yml
          python3 - <<'EOF'
          import sys; sys.path.insert(0, "@bin/scripts")
          from infracost_ci import config
          open("../base.yml", "w").write(config.render([], schema="0.3"))
          EOF
          cd ..
          for side in base head; do
            cp "$side.yml" "$side/infracost.yml"
            cp "$side/config/common.tfvars.example" "$side/config/common.tfvars"
            echo "== $side"; cat "$side/infracost.yml"
          done
      - uses: infracost/actions/diff@a5783eb98adc93aa7a0049fce0abb06fdd30770a # v5.0.1
        with:
          api-key: ${{ secrets.INFRACOST_CLI_AUTHENTICATION_TOKEN }}
          base-path: base
          head-path: head
