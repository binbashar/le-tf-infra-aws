name: Test | Static code and linting
on:
  push:
    branches-ignore:
      - master
  # Branch pushes only check the files they changed (see #929), so a weekly
  # repo-wide sweep still catches formatting drift in layers nobody has touched.
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:
env:
  SSH_AUTH_SOCK: /tmp/ssh_agent.sock

jobs:
  test-and-lint:
    name: Test and Lint
    runs-on: ubuntu-24.04
    env:
      TF_ROOT: . #/home/runner/work/le-tf-infra-aws/le-tf-infra-aws

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          # Full history so the lint step can diff this branch against origin/master.
          fetch-depth: 0

      - name: Context Info
        run: |
          cd $GITHUB_WORKSPACE
          pwd
          ls -la

      - name: Initialize Repo Makefiles
        run: |
          make init-makefiles
          git update-index --assume-unchanged "Makefile"

      - name: Test dependencies
        env:
          TERRAFORM_VER_REF_ARCH: ${{ vars.TERRAFORM_VER_REF_ARCH }}
        run: |
          # Install pre-commit
          sudo -H pip3 install pre-commit
          #
          # Install terraform
          sudo apt-get install unzip curl
          curl -fsSL https://apt.releases.hashicorp.com/gpg | sudo apt-key add -
          wget https://releases.hashicorp.com/terraform/${TERRAFORM_VER_REF_ARCH}/terraform_${TERRAFORM_VER_REF_ARCH}_linux_amd64.zip
          unzip terraform_${TERRAFORM_VER_REF_ARCH}_linux_amd64.zip
          sudo mv terraform /usr/local/bin/
          terraform --version
          #
          # Install terraform-docs
          curl -sSLo ./terraform-docs.tar.gz https://terraform-docs.io/dl/v0.16.0/terraform-docs-v0.16.0-$(uname)-amd64.tar.gz
          tar -xzf terraform-docs.tar.gz
          chmod +x terraform-docs
          sudo mv ./terraform-docs /usr/local/bin/terraform-docs
          terraform-docs --version

      - name: Test terraform format and docs
        shell: bash
        run: |
          set -euo pipefail

          # Scheduled and manual runs sweep the whole repo.
          if [[ "${GITHUB_EVENT_NAME}" != "push" ]]; then
            echo "[INFO] ${GITHUB_EVENT_NAME} run - checking all files"
            make pre-commit
            exit 0
          fi

          # Push runs check only what this branch changed against master, so a
          # pre-existing violation in a layer outside the PR scope cannot fail it.
          git fetch --no-tags --quiet origin master || true
          BASE="$(git merge-base origin/master HEAD 2>/dev/null || true)"

          if [[ -z "${BASE}" ]]; then
            echo "[WARN] no merge-base with origin/master - falling back to all files"
            make pre-commit
            exit 0
          fi

          COUNT="$(git diff --name-only "${BASE}" HEAD | wc -l | tr -d '[:space:]')"
          if [[ "${COUNT}" -eq 0 ]]; then
            echo "[INFO] no files changed since ${BASE::8} - nothing to check"
            exit 0
          fi

          echo "[INFO] checking ${COUNT} file(s) changed since ${BASE::8}:"
          git diff --name-only "${BASE}" HEAD | sed 's/^/  /'
          pre-commit run --from-ref "${BASE}" --to-ref HEAD --show-diff-on-failure

      - name: Notify slack failure workflow run
        uses: slackapi/slack-github-action@v2.0.0
        if: failure()
        with:
          webhook: ${{ secrets.SLACK_DIRECT_WEBHOOK }}
          webhook-type: incoming-webhook
          payload: |
            {
              "blocks": [
                {
                  "type": "header",
                  "text": {
                    "type": "plain_text",
                    "text": "Failed Pipeline! :rotating_light::fire::bash-fire::bangbang::video-games-doom-mad::stopp:"
                  }
                },
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": ":negative_squared_cross_mark: *Project*: ${{ github.repository }} \n :negative_squared_cross_mark: *User*: ${{github.triggering_actor}} \n :negative_squared_cross_mark: *Job*: ${{github.workflow}} \n :negative_squared_cross_mark: *Branch:* ${{ github.ref_name }} \n :negative_squared_cross_mark: *Last Commit:* ${{ github.sha }}"
                  },
                  "accessory": {
                    "type": "button",
                    "text": {
                      "type": "plain_text",
                      "text": ":arrow_forward: View Job in GithubActions",
                      "emoji": true
                    },
                    "value": "click_me_123",
                    "url": "https://github.com/${{github.repository}}/actions/runs/${{github.run_id}}",
                    "action_id": "button-action"
                  }
                }
              ]
            }

      - name: Notify slack succeed workflow run
        uses: slackapi/slack-github-action@v2.0.0
        if: success()
        with:
          webhook: ${{ secrets.SLACK_DIRECT_WEBHOOK }}
          webhook-type: incoming-webhook
          payload: |
            {
              "blocks": [
                {
                  "type": "header",
                  "text": {
                    "type": "plain_text",
                    "text": "Successful Pipeline! :checkered_flag: :video-games-star: :video-games-mario-luigi-dance: :tada: :binbash::bb-leverage: :heart: :open-source:"
                  }
                },
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": ":heavy_check_mark: *Project*: ${{ github.repository }} \n :heavy_check_mark: *User*: ${{github.triggering_actor}} \n :heavy_check_mark: *Job*: ${{github.workflow}} \n :heavy_check_mark: *Branch:* ${{ github.ref_name }} \n :heavy_check_mark: *Last Commit:* ${{ github.sha }}"
                  },
                  "accessory": {
                    "type": "button",
                    "text": {
                      "type": "plain_text",
                      "text": ":arrow_forward: View Job in GithubActions",
                      "emoji": true
                    },
                    "value": "click_me_123",
                    "url": "https://github.com/${{github.repository}}/actions/runs/${{github.run_id}}",
                    "action_id": "button-action"
                  }
                }
              ]
            }
