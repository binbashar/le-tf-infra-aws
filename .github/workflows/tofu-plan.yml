name: OpenTofu plan

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      layer:
        description: Active layer to inspect (must be in the TOFU_PLAN_LAYERS allowlist)
        required: false
        type: string
        default: apps-devstg/global/cli-test-layer

concurrency:
  group: tofu-plan-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHONPATH: '@bin/scripts'
  PLAN_LAYERS: ${{ vars.TOFU_PLAN_LAYERS || 'apps-devstg/global/cli-test-layer' }}

jobs:
  discover:
    name: Test tooling and discover layers
    if: >-
      ${{ github.event_name == 'workflow_dispatch' ||
          (github.event_name == 'pull_request' &&
           github.event.pull_request.draft == false &&
           github.event.pull_request.head.repo.full_name == github.repository &&
           github.event.pull_request.user.type == 'User') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      layers: ${{ steps.run.outputs.layers }}
      targets: ${{ steps.run.outputs.targets }}
      has_layers: ${{ steps.run.outputs.has_layers }}
      blocked: ${{ steps.run.outputs.blocked }}
      live_eligible: ${{ steps.run.outputs.live_eligible }}
    steps:
      - name: Checkout code and history
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      - name: Test workflow tooling
        run: python -m unittest discover -s @bin/scripts/tofu_plan_ci/tests -v

      - name: Discover affected layers
        id: run
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          MANUAL_LAYER: ${{ inputs.layer }}
          MAX_LAYERS: ${{ vars.TOFU_PLAN_MAX_LAYERS || '1' }}
        run: python -m tofu_plan_ci.workflow discover

      - name: Upload discovery evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tofu-plan-discovery
          path: ${{ runner.temp }}/tofu-plan-discovery/
          retention-days: 7
          if-no-files-found: error

  validation:
    name: OpenTofu validation · ${{ matrix.layer }}
    if: ${{ needs.discover.outputs.has_layers == 'true' }}
    needs: discover
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        layer: ${{ fromJSON(needs.discover.outputs.layers) }}
    env:
      LAYER: ${{ matrix.layer }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      - name: Set up OpenTofu
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: ${{ vars.OPENTOFU_VERSION || '1.9.1' }}
          tofu_wrapper: false

      - name: Initialize without backend, validate, and report
        id: run
        run: python -m tofu_plan_ci.workflow static

      - name: Upload sanitized validation evidence
        if: ${{ always() && steps.run.outputs.report_dir != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tofu-plan-validation-${{ steps.run.outputs.slug }}
          path: ${{ steps.run.outputs.report_dir }}/
          retention-days: 7
          if-no-files-found: error

  live_plan:
    name: Live plan · ${{ matrix.layer }}
    if: >-
      ${{ needs.discover.outputs.has_layers == 'true' &&
          needs.discover.outputs.live_eligible == 'true' &&
          vars.TOFU_PLAN_LIVE == 'true' &&
          vars.TOFU_PLAN_ROLES != '' }}
    needs: [discover, validation]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: tofu-plan
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include: ${{ fromJSON(needs.discover.outputs.targets) }}
    env:
      LAYER: ${{ matrix.layer }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      CANDIDATE_ROOT: ${{ github.workspace }}/candidate
      PYTHONPATH: trusted/@bin/scripts
    steps:
      - name: Checkout candidate infrastructure
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: candidate
          persist-credentials: false

      - name: Checkout trusted tooling from the base revision
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          path: trusted
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      - name: Set up OpenTofu
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: ${{ vars.OPENTOFU_VERSION || '1.9.1' }}
          tofu_wrapper: false

      # The account's plan role holds every allowlisted layer's reads; the trusted
      # base revision narrows this job's session to its own layer's state and lock.
      - name: Resolve plan role and layer session policy
        id: identity
        env:
          TOFU_PLAN_ROLES: ${{ vars.TOFU_PLAN_ROLES }}
        run: python -m tofu_plan_ci.workflow credentials

      - name: Configure short-lived AWS plan credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
        with:
          role-to-assume: ${{ steps.identity.outputs.role_arn }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}
          role-session-name: tofu-plan-${{ github.run_id }}
          role-duration-seconds: 900
          allowed-account-ids: ${{ steps.identity.outputs.account_id }}
          inline-session-policy: ${{ steps.identity.outputs.session_policy }}
          mask-aws-account-id: true
          unset-current-credentials: true

      - name: Initialize backend, plan, sanitize, and report
        id: run
        env:
          COMMON_TFVARS: ${{ secrets.TOFU_PLAN_COMMON_TFVARS }}
        run: python -m tofu_plan_ci.workflow live

      - name: Upload sanitized plan evidence
        if: ${{ always() && steps.run.outputs.report_dir != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tofu-plan-layer-${{ steps.run.outputs.slug }}
          path: ${{ steps.run.outputs.report_dir }}/
          retention-days: 7
          if-no-files-found: error

  analysis:
    name: Explain plan with Bedrock
    if: >-
      ${{ always() &&
          needs.discover.outputs.has_layers == 'true' &&
          needs.discover.outputs.live_eligible == 'true' &&
          needs.live_plan.result == 'success' &&
          vars.TOFU_PLAN_LIVE == 'true' &&
          vars.TOFU_PLAN_LLM == 'true' &&
          vars.AWS_TOFU_PLAN_BEDROCK_ROLE_ARN != '' &&
          vars.AWS_TOFU_PLAN_BEDROCK_ACCOUNT_ID != '' }}
    needs: [discover, live_plan]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: tofu-plan-bedrock
    permissions:
      contents: read
      actions: read
      id-token: write
    outputs:
      status: ${{ steps.analyze.outcome || 'not-run' }}
    env:
      PYTHONPATH: trusted/@bin/scripts
    steps:
      - name: Checkout trusted tooling from the base revision
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          path: trusted
          persist-credentials: false

      - name: Download sanitized plan projections
        id: plans
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: tofu-plan-layer-*
          path: ${{ runner.temp }}/tofu-plan-reports

      - name: Set up Python
        if: ${{ steps.plans.outcome == 'success' }}
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      - name: Install Bedrock client
        if: ${{ steps.plans.outcome == 'success' }}
        run: >-
          python -m pip install -q --require-hashes
          -r trusted/@bin/scripts/tofu_plan_ci/requirements.txt

      - name: Configure short-lived Bedrock credentials
        if: ${{ steps.plans.outcome == 'success' }}
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
        with:
          role-to-assume: ${{ vars.AWS_TOFU_PLAN_BEDROCK_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}
          role-session-name: tofu-plan-review-${{ github.run_id }}
          role-duration-seconds: 900
          allowed-account-ids: ${{ vars.AWS_TOFU_PLAN_BEDROCK_ACCOUNT_ID }}
          mask-aws-account-id: true
          unset-current-credentials: true

      - name: Analyze sanitized projections
        id: analyze
        if: ${{ steps.plans.outcome == 'success' }}
        continue-on-error: true
        env:
          MODEL_ID: ${{ vars.BEDROCK_MODEL_ID || 'us.anthropic.claude-haiku-5-5' }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python -m tofu_plan_ci.workflow analyze

      - name: Upload LLM explanation
        if: ${{ steps.analyze.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tofu-plan-llm
          path: ${{ runner.temp }}/tofu-plan-analysis/
          retention-days: 7
          if-no-files-found: error

  report:
    name: OpenTofu Plan
    if: >-
      ${{ always() &&
          (github.event_name == 'workflow_dispatch' ||
           (github.event_name == 'pull_request' &&
            github.event.pull_request.draft == false &&
            github.event.pull_request.head.repo.full_name == github.repository &&
            github.event.pull_request.user.type == 'User')) }}
    needs: [discover, validation, live_plan, analysis]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    env:
      REQUIRE_LIVE: >-
        ${{ vars.TOFU_PLAN_LIVE == 'true' &&
            needs.discover.outputs.live_eligible == 'true' }}
      ANALYSIS_STATUS: ${{ needs.analysis.outputs.status || needs.analysis.result }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      PYTHONPATH: trusted/@bin/scripts
    steps:
      - name: Checkout reporting tooling
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          # Static-only workflow changes use their candidate reporter for bootstrap/testing;
          # credential-eligible runs always use the trusted base revision.
          ref: >-
            ${{ needs.discover.outputs.live_eligible == 'true' &&
                (github.event.pull_request.base.sha || github.sha) ||
                (github.event.pull_request.head.sha || github.sha) }}
          path: trusted
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      - name: Download discovery evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: tofu-plan-discovery
          path: ${{ runner.temp }}/tofu-plan-discovery

      - name: Download live plan evidence
        if: ${{ needs.discover.outputs.has_layers == 'true' && env.REQUIRE_LIVE == 'true' }}
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: tofu-plan-layer-*
          path: ${{ runner.temp }}/tofu-plan-reports

      - name: Download credential-free validation evidence
        if: ${{ needs.discover.outputs.has_layers == 'true' && env.REQUIRE_LIVE != 'true' }}
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: tofu-plan-validation-*
          path: ${{ runner.temp }}/tofu-plan-reports

      - name: Download LLM explanation
        if: ${{ needs.analysis.outputs.status == 'success' }}
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: tofu-plan-llm
          path: ${{ runner.temp }}/tofu-plan-analysis

      - name: Build and enforce native GitHub summary
        run: python -m tofu_plan_ci.workflow aggregate
