name: Release Management

on:
  # Without this, the draft only refreshed when some *other* PR happened to fire an
  # event, so PRs merged after the last one were silently missing from it. v3.1.0 was
  # stale by four PRs at publish time for exactly this reason.
  push:
    branches:
      - master
  # pull_request event is required only for autolabeler
  pull_request:
    # Only following types are handled by the action, but one can default to all as well
    types: [opened, reopened, synchronize, labeled, unlabeled]

# The autolabeler writes labels, so the read-only default token is not enough.
# Fork PRs still get a read-only token — autolabeling is skipped there by design,
# rather than moving to pull_request_target, which would expose secrets to forks.
permissions:
  contents: write
  pull-requests: write

# Two runs that start together each fail to see the other's draft and create one,
# leaving duplicate drafts for the same version. Observed on 2026-09-13: relabelling
# several merged PRs produced two byte-identical `v3.1.1` drafts in the same second.
# Serialise instead of cancelling — a cancelled run just skips a merge.
concurrency:
  group: release-drafter-${{ github.repository }}
  cancel-in-progress: false

jobs:
  update_release_draft:
    runs-on: ubuntu-latest
    steps:
      # Drafts your next Release notes
      - uses: release-drafter/release-drafter@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: act10ns/slack@v1
        if: failure()
        with:
          status: ${{ job.status }}
          channel: $SLACK_CI_CHANNEL
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_CI_CHANNEL: ${{ secrets.SLACK_CI_CHANNEL }}
