name: Costs | infracost
# Estimates the monthly cost change of a pull request with Infracost (CLI v2, run by
# infracost/actions/diff@v5), scoped to the active OpenTofu layers the PR affects.
#
# Scope comes from @bin/scripts/infracost_ci, which reuses the layer discovery of the
# OpenTofu plan CI: disabled `--` layers never count, a change under config/ or
# {account}/config/ expands to every layer it feeds, a deleted layer is estimated on the
# base side only. A PR that affects no active layer skips with a notice.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, closed]
    # Cheap first filter; the scope step decides what actually runs.
    paths:
      - '**/*.tf'
      - '**/*.tfvars'
      - '**/*.tfvars.example'
      - '**/.terraform.lock.hcl'
      - 'config/**'
      - '.github/workflows/infracost.yml'
      - '@bin/scripts/infracost_ci/**'
      - '@bin/scripts/tofu_plan_ci/discover.py'

permissions:
  contents: read
  pull-requests: write

jobs:
  infracost:
    name: Infracost
    if: ${{ !github.event.pull_request.draft }}
    # Job-level, not workflow-level: a run whose job is skipped (a draft PR, or the
    # synchronize event racing ready_for_review) never joins the group, so it cannot
    # cancel the run that does the work.
    concurrency:
      group: infracost-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SCOPE_DIR: ${{ github.workspace }}/.infracost-scope
    steps:
      # Dependabot-triggered runs and fork PRs get no Actions secrets, so the token is
      # empty there. Skip the estimate rather than fail the PR.
      - name: Check for an Infracost token
        id: token
        env:
          INFRACOST_CLI_AUTHENTICATION_TOKEN: ${{ secrets.INFRACOST_CLI_AUTHENTICATION_TOKEN }}
        run: |
          if [ -z "${INFRACOST_CLI_AUTHENTICATION_TOKEN}" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No Infracost token (Dependabot or fork PR) - Infracost did not run."
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi

      # A closed PR has nothing to estimate: diff@v5 only reports the merged/closed
      # status to the Infracost dashboard, which needs no checkout.
      - name: Report the pull request status
        if: ${{ steps.token.outputs.available == 'true' && github.event.action == 'closed' }}
        uses: infracost/actions/diff@a5783eb98adc93aa7a0049fce0abb06fdd30770a # v5.0.1
        with:
          api-key: ${{ secrets.INFRACOST_CLI_AUTHENTICATION_TOKEN }}

      - name: Checkout PR branch
        if: ${{ steps.token.outputs.available == 'true' && github.event.action != 'closed' }}
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          path: head
          fetch-depth: 0
          persist-credentials: false

      - name: Scope to the affected layers
        id: scope
        if: ${{ steps.token.outputs.available == 'true' && github.event.action != 'closed' }}
        working-directory: head
        env:
          PYTHONPATH: '@bin/scripts'
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 -m infracost_ci --schema 0.3 scope \
            --base "$BASE_SHA" --head "$HEAD_SHA" --out-dir "$SCOPE_DIR"
          if ! grep -q '^has_layers=true$' "$GITHUB_OUTPUT"; then
            echo "::notice::No active OpenTofu layer is affected by this PR - Infracost did not run."
          fi

      - name: Checkout base branch
        if: ${{ steps.scope.outputs.has_layers == 'true' }}
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
          persist-credentials: false

      # Infracost reads infracost.yml from the root of each checkout. common.tfvars is
      # gitignored; the example carries the same keys with placeholder values.
      - name: Install the scoped configs
        if: ${{ steps.scope.outputs.has_layers == 'true' }}
        run: |
          for side in base head; do
            cp "$SCOPE_DIR/$side.yml" "$side/infracost.yml"
            cp "$side/config/common.tfvars.example" "$side/config/common.tfvars"
          done

      - name: Infracost diff
        id: diff
        if: ${{ steps.scope.outputs.has_layers == 'true' }}
        uses: infracost/actions/diff@a5783eb98adc93aa7a0049fce0abb06fdd30770a # v5.0.1
        with:
          api-key: ${{ secrets.INFRACOST_CLI_AUTHENTICATION_TOKEN }}
          base-path: base
          head-path: head

      # diff@v5 exposes no outputs, so the headline is read back from the PR comment it
      # just posted (tagged `infracost-comment`). Only cost increases reach Slack.
      - name: Read the estimate headline
        id: headline
        if: ${{ steps.diff.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          SLACK_WEBHOOK_URL_COST: ${{ secrets.SLACK_WEBHOOK_URL_COST }}
        run: |
          body=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" \
            --jq '.[] | select(.body | contains("infracost-comment")) | .body' | tail -c 200000)
          headline=$(printf '%s' "$body" | grep -oE 'Monthly estimate [a-z]+ by \$[0-9.,]+[kKmM]?' | tail -n1 || true)
          echo "headline=${headline}" >> "$GITHUB_OUTPUT"
          if [[ "$headline" == *increased* && -n "$SLACK_WEBHOOK_URL_COST" ]]; then
            echo "notify=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build the Slack message
        if: ${{ steps.headline.outputs.notify == 'true' }}
        env:
          HEADLINE: ${{ steps.headline.outputs.headline }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          jq -n --arg text ":chart_with_upwards_trend: *${GITHUB_REPOSITORY}*: ${HEADLINE}/month in <${PR_URL}|${PR_TITLE//[<>|]/}> by ${PR_AUTHOR}" \
            '{text: $text}' > "$SCOPE_DIR/slack.json"

      - name: Send the cost increase to Slack
        if: ${{ steps.headline.outputs.notify == 'true' }}
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL_COST }}
          webhook-type: incoming-webhook
          payload-file-path: ${{ env.SCOPE_DIR }}/slack.json
