name: Costs | infracost
# Estimates the monthly cost change of a pull request with Infracost (CLI v2, run by
# infracost/actions/diff@v5), scoped to the active OpenTofu layers the PR affects.
#
# Scope comes from @bin/scripts/infracost_ci, which reuses the layer discovery of the
# OpenTofu plan CI: disabled `--` layers never count, a change under config/ or
# {account}/config/ expands to every layer it feeds, a deleted layer is estimated on the
# base side only. A PR that affects no active layer skips with a notice.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, closed]
    # Cheap first filter; the scope step decides what actually runs.
    paths:
      - '**/*.tf'
      - '**/*.tfvars'
      - '**/*.tfvars.example'
      - '**/.terraform.lock.hcl'
      - 'config/**'
      - '.github/workflows/infracost.yml'
      - '@bin/scripts/infracost_ci/**'
      - '@bin/scripts/tofu_plan_ci/discover.py'

permissions:
  contents: read
  pull-requests: write

jobs:
  infracost:
    name: Infracost
    if: ${{ !github.event.pull_request.draft }}
    # Job-level, not workflow-level: a run whose job is skipped (a draft PR, or the
    # synchronize event racing ready_for_review) never joins the group, so it cannot
    # cancel the run that does the work.
    concurrency:
      group: infracost-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SCOPE_DIR: ${{ github.workspace }}/.infracost-scope
    steps:
      # Dependabot-triggered runs and fork PRs get no Actions secrets, so the token is
      # empty there. Skip the estimate rather than fail the PR.
      - name: Check for an Infracost token
        id: token
        env:
          INFRACOST_CLI_AUTHENTICATION_TOKEN: ${{ secrets.INFRACOST_CLI_AUTHENTICATION_TOKEN }}
        run: |
          if [ -z "${INFRACOST_CLI_AUTHENTICATION_TOKEN}" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No Infracost token (Dependabot or fork PR) - Infracost did not run."
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi

      # A closed PR has nothing to estimate: diff@v5 only reports the merged/closed
      # status to the Infracost dashboard, which needs no checkout.
      - name: Report the pull request status
        if: ${{ steps.token.outputs.available == 'true' && github.event.action == 'closed' }}
        uses: infracost/actions/diff@a5783eb98adc93aa7a0049fce0abb06fdd30770a # v5.0.1
        with:
          api-key: ${{ secrets.INFRACOST_CLI_AUTHENTICATION_TOKEN }}

      - name: Checkout PR branch
        if: ${{ steps.token.outputs.available == 'true' && github.event.action != 'closed' }}
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          path: head
          fetch-depth: 0
          persist-credentials: false

      - name: Scope to the affected layers
        id: scope
        if: ${{ steps.token.outputs.available == 'true' && github.event.action != 'closed' }}
        working-directory: head
        env:
          PYTHONPATH: '@bin/scripts'
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 -m infracost_ci --schema 0.3 scope \
            --base "$BASE_SHA" --head "$HEAD_SHA" --out-dir "$SCOPE_DIR"
          if ! grep -q '^has_layers=true$' "$GITHUB_OUTPUT"; then
            echo "::notice::No active OpenTofu layer is affected by this PR - Infracost did not run."
          fi

      - name: Checkout base branch
        if: ${{ steps.scope.outputs.has_layers == 'true' }}
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
          persist-credentials: false

      # Infracost reads infracost.yml from the root of each checkout. common.tfvars is
      # gitignored; the example carries the same keys with placeholder values. A layer the
      # PR deletes gets an empty stand-in at the head, so it is estimated as removed rather
      # than leaving the head with no project, in which case Infracost posts nothing.
      - name: Install the scoped configs
        if: ${{ steps.scope.outputs.has_layers == 'true' }}
        run: |
          for side in base head; do
            cp "$SCOPE_DIR/$side.yml" "$side/infracost.yml"
            cp "$side/config/common.tfvars.example" "$side/config/common.tfvars"
          done
          while IFS= read -r layer; do
            [ -n "$layer" ] || continue
            mkdir -p "head/$layer"
            : > "head/$layer/infracost-deleted-layer.tf"
          done < "$SCOPE_DIR/stubs.txt"

      # The headline already on the PR, if any. Infracost rewrites its comment on every
      # run, so without this a push that leaves the estimate unchanged re-announces it.
      - name: Read the previous estimate headline
        id: previous
        if: ${{ steps.scope.outputs.has_layers == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          body=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" \
            --jq '.[]
              | select(.user.login == "github-actions[bot]")
              | select(.body | startswith("[//]: <> (infracost-comment"))
              | .body' | tail -c 200000)
          headline=$(printf '%s' "$body" | grep -oE 'Monthly estimate [a-z]+ by \$[0-9.,]+[kKmM]?' | tail -n1 || true)
          echo "headline=${headline}" >> "$GITHUB_OUTPUT"

      - name: Mark the start of the diff
        id: started
        if: ${{ steps.scope.outputs.has_layers == 'true' }}
        run: echo "at=$(date -u -d '-5 seconds' +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Infracost diff
        id: diff
        if: ${{ steps.scope.outputs.has_layers == 'true' }}
        uses: infracost/actions/diff@a5783eb98adc93aa7a0049fce0abb06fdd30770a # v5.0.1
        with:
          api-key: ${{ secrets.INFRACOST_CLI_AUTHENTICATION_TOKEN }}
          base-path: base
          head-path: head

      # diff@v5 exposes no outputs, so the headline is read back from the PR comment it
      # just posted. Only that comment counts: authored by github-actions[bot], opening
      # with the `infracost-comment` marker, and written by this run. A pasted lookalike
      # comment, or one left by an earlier run, is ignored. Only an increase reaches Slack,
      # and only when its headline differs from the one already on the PR.
      #
      # The comment carries no run id, so "written by this run" is a time window opening
      # 5 s before the diff (slack for runner/API clock skew). No earlier run can write in
      # it: the job-level concurrency group cancels any earlier run of this PR when this
      # job starts, and the checkouts and scope step take far longer than 5 s before the
      # window opens. The closed-PR path never comments. Dropping that concurrency group
      # would reopen the gap.
      - name: Read the estimate headline
        id: headline
        if: ${{ steps.diff.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          SINCE: ${{ steps.started.outputs.at }}
          PREVIOUS: ${{ steps.previous.outputs.headline }}
          SLACK_WEBHOOK_URL_COST: ${{ secrets.SLACK_WEBHOOK_URL_COST }}
        run: |
          body=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" \
            --jq '.[]
              | select(.user.login == "github-actions[bot]")
              | select(.body | startswith("[//]: <> (infracost-comment"))
              | select(.updated_at >= env.SINCE)
              | .body' | tail -c 200000)
          headline=$(printf '%s' "$body" | grep -oE 'Monthly estimate [a-z]+ by \$[0-9.,]+[kKmM]?' | tail -n1 || true)
          echo "headline=${headline}" >> "$GITHUB_OUTPUT"
          if [[ "$headline" == *increased* && "$headline" != "$PREVIOUS" && -n "$SLACK_WEBHOOK_URL_COST" ]]; then
            echo "notify=true" >> "$GITHUB_OUTPUT"
          elif [[ "$headline" == *increased* && "$headline" == "$PREVIOUS" ]]; then
            echo "::notice::Estimate unchanged since the last run (${headline}) - Slack not notified again."
          fi

      - name: Build the Slack message
        if: ${{ steps.headline.outputs.notify == 'true' }}
        env:
          HEADLINE: ${{ steps.headline.outputs.headline }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        # Slack mrkdwn reads &, < and > as control characters, so the title is escaped
        # (a literal "&amp;" stays "&amp;"). A | would end the link label; it has no
        # escape, so it becomes a look-alike.
        run: |
          jq -n --arg repo "$GITHUB_REPOSITORY" --arg headline "$HEADLINE" --arg url "$PR_URL" \
            --arg title "$PR_TITLE" --arg author "$PR_AUTHOR" '
            def esc: gsub("&"; "&amp;") | gsub("<"; "&lt;") | gsub(">"; "&gt;");
            {text: ":chart_with_upwards_trend: *\($repo)*: \($headline)/month in <\($url)|\($title | esc | gsub("[|]"; "\u2223"))> by \($author | esc)"}
          ' > "$SCOPE_DIR/slack.json"

      - name: Send the cost increase to Slack
        if: ${{ steps.headline.outputs.notify == 'true' }}
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL_COST }}
          webhook-type: incoming-webhook
          payload-file-path: ${{ env.SCOPE_DIR }}/slack.json
