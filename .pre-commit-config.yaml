default_language_version:
    # force all unspecified python hooks to run python3
    python: python3

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: check-json
      - id: check-merge-conflict
      - id: detect-private-key
      - id: pretty-format-json
        args:
          - --autofix
      - id: trailing-whitespace
        args:
          - --markdown-linebreak-ext=md
        # Vendored upstream CRD bundles must stay byte-identical to the release
        # asset they came from — that identity is the whole point of vendoring
        # them. Autofixing whitespace would quietly break it.
        exclude: ^apps-devstg/us-east-1/k8s-eks-demoapps/k8s-components/crds/

  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.55.0
    hooks:
      - id: terraform_fmt
#      - id: terraform_validate
  - repo: https://github.com/renovatebot/pre-commit-hooks
    rev: 37.419.1
    hooks:
      - id: renovate-config-validator

  - repo: local
    hooks:
      # Whole-tree check (pass_filenames: false): a new layer is missing the
      # PRM tag regardless of which file the commit happens to touch.
      - id: prm-apn-id-tag
        name: PRM aws-apn-id tag present in every layer
        entry: python3 @bin/scripts/prm_tags/check.py --root .
        language: system
        pass_filenames: false
        files: \.tf$
