# -------------------------------------------------------------------------------------------
# AlertManager
# -------------------------------------------------------------------------------------------
# Gated on the variable rather than hardcoded `true`. The Slack config below
# is the only receiver, and its webhook comes from the
# `/notifications/alertmanager` secret, which is read only when
# `prometheus.kube_stack.alertmanager.enabled` is set. Hardcoding `true` while
# the variable was false rendered an Alertmanager whose `slack_api_url` was the
# empty string — a config it rejects at startup.
alertmanager:
  enabled: ${alertmanagerEnabled}

  config:
    global:
      slack_api_url: ${alertmanagerSlackWebhook}
    route:
      group_by:
        - namespace
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 1h
      receiver: 'slack-notifications'
      routes:
      - receiver: 'slack-notifications'
        continue: true
    receivers:
    - name: 'slack-notifications'
      slack_configs:
      - channel: '#${alertmanagerSlackChannel}'
        send_resolved: true
        text: '{{ template "slack.alert.text" }}'

  templateFiles:
    alert.tmpl: |-
      {{ define "slack.alert.text" }}
      {{ range .Alerts }}
      *Alert:* {{ .Annotations.summary }} - `{{ .Labels.severity }}` \n
        *Environment:* {{ .Labels.cluster }} \n
        *Description:* {{ .Annotations.description }} \n
        *Graph:* <{{ .GeneratorURL }}|:chart_with_upwards_trend:> - *Runbook:* <{{ .Annotations.runbook }}|:documentation:> \n
        *Details:* \n {{ range .Labels.SortedPairs }} • *{{ .Name }}:* `{{ .Value }}` \n
        {{ end }}
      {{ end }}
      {{ end }}

  # No Ingress. Published at `alertmanager.aws.binbash.com.ar` by the chart's
  # own `route.main` below, which lives inside this same gated block, so the
  # route disappears with the workload.
  #
  # Its cert-manager annotation also pointed at a ClusterIssuer that does not
  # exist here (`clusterissuer-arta-...`, from a different project) — a
  # copy-paste that would have left this hostname without a certificate. Moot
  # now: the gateway terminates TLS with the shared wildcard.
  ingress:
    enabled: false

  # `enabled: true` unconditionally is safe: the chart guards this template on
  # `alertmanager.enabled` above, so with the workload off the route is not
  # rendered at all (verified by templating the chart with both flags set that
  # way). That is the same coupling the hand-written manifest expressed through
  # its `count`.
  route:
    main:
      enabled: true
      parentRefs: ${parentRefs}
      hostnames:
        - ${alertmanagerHost}

  alertmanagerSpec:
    nodeSelector: ${nodeSelector}
    tolerations: ${tolerations}

    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: gp2
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 2Gi

# -------------------------------------------------------------------------------------------
# Grafana
# -------------------------------------------------------------------------------------------
grafana:
  enabled: true

  adminUser: ${grafanaUser}
  adminPassword: ${grafanaPassword}

  serviceAccount:
    name: grafana
    annotations:
      eks.amazonaws.com/role-arn: ${grafanaRoleArn}

  # No Ingress. Published at `grafana.aws.binbash.com.ar` by the chart's own
  # `route.main` below.
  ingress:
    enabled: false

  # The chart's own key renders this route: same object the hand-written
  # `kubernetes_manifest` produced, but applied server-side by Helm, so it
  # needs no Gateway API CRD registered at plan time.
  route:
    main:
      enabled: true
      parentRefs: ${parentRefs}
      hostnames:
        - ${grafanaHost}

  # Grafana builds absolute URLs (share links, OAuth redirects, alert
  # notification links) from this. Left implicit it derives from the Service
  # name and every such link points somewhere unreachable.
  "grafana.ini":
    server:
      domain: grafana.${privateBaseDomain}
      root_url: "https://grafana.${privateBaseDomain}"

  nodeSelector: ${nodeSelector}
  tolerations: ${tolerations}

  persistence:
    enabled: true
    size: 5Gi
    storageClassName: gp2

  # additionalDataSources:
  #   - name: CloudWatch
  #     type: cloudwatch
  #     jsonData:
  #       authType: default
  #       defaultRegion: us-east-1

# -------------------------------------------------------------------------------------------
# NodeExporter
# -------------------------------------------------------------------------------------------
nodeExporter:
  enabled: true

# -------------------------------------------------------------------------------------------
# KubeStateMetrics
# -------------------------------------------------------------------------------------------
kubeStateMetrics:
  enabled: true

kube-state-metrics:
  nodeSelector: ${nodeSelector}
  tolerations: ${tolerations}

# -------------------------------------------------------------------------------------------
# Prometheus
# -------------------------------------------------------------------------------------------
prometheus:
  enabled: true

  # No Ingress. Published at `prometheus.aws.binbash.com.ar` by the chart's own
  # `route.main` below.
  ingress:
    enabled: false

  # The chart's own key renders this route: same object the hand-written
  # `kubernetes_manifest` produced, but applied server-side by Helm, so it
  # needs no Gateway API CRD registered at plan time.
  route:
    main:
      enabled: true
      parentRefs: ${parentRefs}
      hostnames:
        - ${prometheusHost}

  prometheusSpec:
    nodeSelector: ${nodeSelector}
    tolerations: ${tolerations}

    # Same reason as Grafana's root_url: the web UI builds self-referential
    # links (and the Alertmanager `generatorURL` on every alert) from this.
    externalUrl: "https://prometheus.${privateBaseDomain}"

    # 30d against the 20Gi claim below. This is a demo cluster that gets torn
    # down nightly, so retention is effectively bounded by the teardown, not by
    # this number — but leaving it at 30d keeps the volume from being the thing
    # that fills up if the cluster is left running over a weekend.
    retention: 30d

    # `gp2` is the only StorageClass on this cluster and it still declares the
    # in-tree `kubernetes.io/aws-ebs` provisioner, which no longer exists in
    # Kubernetes 1.34. It works anyway: the CSI migration shim rewrites the
    # claim onto `ebs.csi.aws.com` (the aws-ebs-csi-driver EKS addon). Verified
    # by binding a probe PVC before enabling this — it bound in 20s. Note the
    # class is *not* marked default, so every claim here has to name it
    # explicitly or it hangs Pending forever.
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: gp2
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 20Gi

  # additionalServiceMonitors:
  # - name: my-app
  #   selector:
  #     matchLabels:
  #       argocd.argoproj.io/instance: my-app
  #   namespaceSelector:
  #     matchNames:
  #     - my-app
  #   endpoints:
  #     - port: http
  #       path: /internal/metrics
  #       scheme: http
  #       interval: 30s

# -------------------------------------------------------------------------------------------
# Prometheus Operator
# -------------------------------------------------------------------------------------------
prometheusOperator:
  enabled: true
  admissionWebHooks:
    patch:
      nodeSelector: ${nodeSelector}
      tolerations: ${tolerations}
  nodeSelector: ${nodeSelector}
  tolerations: ${tolerations}


# -------------------------------------------------------------------------------------------
# Disable KubeControllerManagerDown and KubeSchedulerDown since they aren't necessary on EKS.
# Disable WatchDog until we can integrate it with PagerDuty or similar.
# -------------------------------------------------------------------------------------------
defaultRules:
  rules:
    kubeControllerManager: false
    kubeSchedulerAlerting: false

  disabled:
    Watchdog: true
    KubeControllerManagerDown: true
    KubeSchedulerDown: true
    KubeletTooManyPods: true
    InfoInhibitor: true

kubeControllerManager:
  enabled: false

kubeScheduler:
  enabled: false
