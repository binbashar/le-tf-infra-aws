# Whether the dashboard component should be installed
dashboard:
  enabled: true
  # Chart 10.x defaults this to 2. One is enough for a read-only dashboard, and
  # the `tools` node group runs at desired = 1 behind a 17-pod ceiling per
  # t3.medium — a second replica just pushes something else into a scale-up.
  replicaCount: 1

  # No Ingress. The chart's own `dashboard.httpRoute` publishes
  # `goldilocks.aws.binbash.com.ar` on the private Gateway, whose HTTPS
  # listener terminates TLS — so the cert-manager Certificate this used to
  # request is gone, and with it the hardcoded `private-apps` ingress class
  # that nothing serves.
  #
  # The chart renders the same object the hand-written manifest did (same
  # name, hostname and :80 backend) and Helm applies it server-side, so it
  # needs no Gateway API CRD registered at plan time.
  ingress:
    enabled: false

  httpRoute:
    enabled: true
    parentRefs: ${parentRefs}
    hostnames:
      - ${host}
