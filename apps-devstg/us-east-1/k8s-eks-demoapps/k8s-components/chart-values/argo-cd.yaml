# ---------------------------------------------------------
# Global shared configs
# ---------------------------------------------------------
global:
  domain: ${argoHost}

  nodeSelector: ${nodeSelector}
  tolerations: ${tolerations}

# ---------------------------------------------------------
# ArgoCD configs
# ---------------------------------------------------------
configs:
  cm:
    exec.enabled: "${enableWebTerminal}"

  params:
    # Diff server-side, against a dry-run apply, instead of comparing the git
    # manifest to the live object field by field.
    #
    # Without it every Application here sits permanently `OutOfSync` while
    # being `Healthy`, and `argocd app diff` prints nothing — the worst kind of
    # false signal, because it trains you to ignore the sync status. The cause
    # is defaulted fields on **custom** resources: the API server writes
    # `ports[].protocol: TCP` into emojivoto's `Rollout`s and ESO writes its
    # policy defaults into google-microservices' `ExternalSecret`, and Argo CD
    # cannot tell a server default from a drift on a CRD-typed object the way
    # it can for built-in kinds. Server-side diff asks the API server what the
    # manifest *would* produce, so defaults are on both sides and cancel.
    #
    # `ServerSideApply=true` in each Application's `syncOptions` does not
    # imply this — that governs how a sync writes, this governs how a
    # comparison reads. Both are wanted.
    #
    # Global rather than the per-Application
    # `argocd.argoproj.io/compare-options: ServerSideDiff=true` annotation:
    # the problem is structural, not particular to these two apps, and every
    # workload that arrives with a CRD will hit it.
    controller.diff.server.side: "true"

    # Serve plain HTTP. TLS is terminated at the Envoy Gateway's HTTPS
    # listener, and the hop from Envoy to this Service is cleartext inside the
    # cluster. Without this argocd-server runs its own TLS and answers the
    # gateway's cleartext request with a 307 to https://, which the gateway
    # then re-terminates -- an infinite redirect from the browser's point of
    # view. This is the documented setting for running behind a
    # TLS-terminating proxy.
    #
    # Consequence for the CLI: with `server.insecure` argocd-server multiplexes
    # gRPC and HTTP on the same port using h2c, and Envoy speaks HTTP/1.1
    # upstream by default, so plain `argocd login` cannot negotiate gRPC. Use
    # `argocd login argocd.aws.binbash.com.ar --grpc-web`, which tunnels gRPC
    # over HTTP/1.1. The alternative is `appProtocol: kubernetes.io/h2c` on the
    # server Service port, which Envoy Gateway honours to switch the upstream
    # to HTTP/2 -- not done here because the chart does not expose that field
    # and it would need a patch resource to set it.
    server.insecure: true

# ---------------------------------------------------------
# Repository Server
# ---------------------------------------------------------
repoServer:
  env:
  # Increase the default timeout applied when the repo-server executes config management tools
  # such as helm or kustomize
  - name: ARGOCD_EXEC_TIMEOUT
    value: 3m0s

# ---------------------------------------------------------
# Server
# ---------------------------------------------------------
server:
  # No Ingress. The `private-apps` ingress class is dead -- nginx-ingress was
  # retired and nothing watches it. Exposure is the chart's own `httproute`,
  # attached to the platform-shared `private-gw-eg` Envoy Gateway. TLS and the
  # certificate come from the gateway's HTTPS listener (the
  # `*.aws.binbash.com.ar` wildcard), so there is no per-app cert-manager
  # Certificate here any more.
  ingress:
    enabled: false

  # The chart's own key renders this route: same object the hand-written
  # `kubernetes_manifest` produced, but applied server-side by Helm, so it
  # needs no Gateway API CRD registered at plan time.
  #
  # Note the chart points the backendRef at the Service's `https` port (443)
  # where the hand-written route used `http` (80). Equivalent here: both ports
  # target 8080, `server.insecure` above makes that port plain HTTP, and
  # neither port carries an appProtocol, so Envoy stays cleartext upstream
  # either way.
  httproute:
    enabled: true
    parentRefs: ${parentRefs}
    hostnames:
      - ${argocdHost}


# ---------------------------------------------------------
#  Notifications Controller
# ---------------------------------------------------------
notifications:
  enabled: ${enableNotifications}

  secret:
    create: ${enableNotifications}
    items:
      slack-token: ${slackNotificationsAppToken}

  # -- Notification services
  notifiers:
    service.slack: |
      token: $slack-token
      username: ArgoCD-PRD
      icon: https://raw.githubusercontent.com/argoproj/argo-cd/master/docs/assets/logo.png

  # -- Centrally managed global application subscriptions
  subscriptions:
    - recipients:
      - slack:${slackNotificationsChannel}
      triggers:
      - on-deployed
      - on-health-degraded
      - on-sync-failed
      - on-sync-status-unknown
      - on-sync-succeeded

  # -- Templates to generate the notification content
  templates:
    template.app-created: |
      message: Application *{{(call .strings.ToUpper .app.metadata.name)}}* has been created.
    template.app-deleted: |
      message: Application *{{(call .strings.ToUpper .app.metadata.name)}}* has been deleted.
    template.app-deployed: |
      message: |
        {{if eq .serviceType "slack"}}:white_check_mark:{{end}} Application *{{(call .strings.ToUpper .app.metadata.name)}}* is now running new version of deployments manifests.
      slack:
        attachments: |
          [{
            "author_name": "{{(call .strings.ToUpper .app.metadata.name)}}",
            "author_link": "https://{{.context.argocdUrl}}/applications/{{.app.metadata.name}}",
            "color": "#18be52",
            "fields": [
            {
              "title": "Sync Status",
              "value": "{{.app.status.sync.status}}",
              "short": true
            },
            {
              "title": {{- if .app.spec.source }} "Repository" {{- else if .app.spec.sources }} "Repositories" {{- end }},
              "value": {{- if .app.spec.source }} ":arrow_heading_up: {{ .app.spec.source.repoURL }}" {{- else if .app.spec.sources }} "{{- range $index, $source := .app.spec.sources }}{{ if $index }}\n{{ end }}:arrow_heading_up: {{ $source.repoURL }}{{- end }}" {{- end }},
              "short": true
            },
            {
              "title": "Revision",
              "value": "{{.app.status.sync.revision}}",
              "short": true
            }
            {{range $index, $c := .app.status.conditions}}
            ,
            {
              "title": "{{$c.type}}",
              "value": "{{$c.message}}",
              "short": true
            }
            {{end}}
            ]
          }]
        deliveryPolicy: Post
        notifyBroadcast: false
    template.app-health-degraded: |
      message: |
        {{if eq .serviceType "slack"}}:exclamation:{{end}} Application *{{(call .strings.ToUpper .app.metadata.name)}}* has degraded.
        Application details: {{.context.argocdUrl}}/applications/{{.app.metadata.name}}.
      slack:
        attachments: |
          [{
            "author_name": "{{(call .strings.ToUpper .app.metadata.name)}}",
            "author_link": "https://{{.context.argocdUrl}}/applications/{{.app.metadata.name}}",
            "color": "#f4c030",
            "fields": [
            {
              "title": "Health Status",
              "value": "{{.app.status.health.status}}",
              "short": true
            },
            {
              "title": {{- if .app.spec.source }} "Repository" {{- else if .app.spec.sources }} "Repositories" {{- end }},
              "value": {{- if .app.spec.source }} ":arrow_heading_up: {{ .app.spec.source.repoURL }}" {{- else if .app.spec.sources }} "{{- range $index, $source := .app.spec.sources }}{{ if $index }}\n{{ end }}:arrow_heading_up: {{ $source.repoURL }}{{- end }}" {{- end }},
              "short": true
            }
            {{range $index, $c := .app.status.conditions}}
            ,
            {
              "title": "{{$c.type}}",
              "value": "{{$c.message}}",
              "short": true
            }
            {{end}}
            ]
          }]
        deliveryPolicy: Post
        notifyBroadcast: false
    template.app-sync-failed: |
      message: |
        {{if eq .serviceType "slack"}}:exclamation:{{end}}  The sync operation of application *{{(call .strings.ToUpper .app.metadata.name)}}* has failed at {{.app.status.operationState.finishedAt}} with the following error: {{.app.status.operationState.message}}
        Sync operation details are available at: {{.context.argocdUrl}}/applications/{{.app.metadata.name}}?operation=true .
      slack:
        attachments: |
          [{
            "author_name": "{{(call .strings.ToUpper .app.metadata.name)}}",
            "author_link": "https://{{.context.argocdUrl}}/applications/{{.app.metadata.name}}",
            "color": "#E96D76",
            "fields": [
            {
              "title": "Sync Status",
              "value": "{{.app.status.sync.status}}",
              "short": true
            },
            {
              "title": {{- if .app.spec.source }} "Repository" {{- else if .app.spec.sources }} "Repositories" {{- end }},
              "value": {{- if .app.spec.source }} ":arrow_heading_up: {{ .app.spec.source.repoURL }}" {{- else if .app.spec.sources }} "{{- range $index, $source := .app.spec.sources }}{{ if $index }}\n{{ end }}:arrow_heading_up: {{ $source.repoURL }}{{- end }}" {{- end }},
              "short": true
            }
            {{range $index, $c := .app.status.conditions}}
            ,
            {
              "title": "{{$c.type}}",
              "value": "{{$c.message}}",
              "short": true
            }
            {{end}}
            ]
          }]
        deliveryPolicy: Post
        notifyBroadcast: false
    template.app-sync-running: |
      message: |
        The sync operation of application *{{(call .strings.ToUpper .app.metadata.name)}}* has started at {{.app.status.operationState.startedAt}}.
        Sync operation details are available at: {{.context.argocdUrl}}/applications/{{.app.metadata.name}}?operation=true .
      slack:
        attachments: |
          [{
            "author_name": "{{(call .strings.ToUpper .app.metadata.name)}}",
            "author_link": "https://{{.context.argocdUrl}}/applications/{{.app.metadata.name}}",
            "color": "#0DADEA",
            "fields": [
            {
              "title": "Sync Status",
              "value": "{{.app.status.sync.status}}",
              "short": true
            },
            {
              "title": {{- if .app.spec.source }} "Repository" {{- else if .app.spec.sources }} "Repositories" {{- end }},
              "value": {{- if .app.spec.source }} ":arrow_heading_up: {{ .app.spec.source.repoURL }}" {{- else if .app.spec.sources }} "{{- range $index, $source := .app.spec.sources }}{{ if $index }}\n{{ end }}:arrow_heading_up: {{ $source.repoURL }}{{- end }}" {{- end }},
              "short": true
            }
            {{range $index, $c := .app.status.conditions}}
            ,
            {
              "title": "{{$c.type}}",
              "value": "{{$c.message}}",
              "short": true
            }
            {{end}}
            ]
          }]
        deliveryPolicy: Post
        notifyBroadcast: false
    template.app-sync-status-unknown: |
      message: |
        {{if eq .serviceType "slack"}}:exclamation:{{end}} Application *{{(call .strings.ToUpper .app.metadata.name)}}* sync is 'Unknown'.
        Application details: {{.context.argocdUrl}}/applications/{{.app.metadata.name}}.
        {{if ne .serviceType "slack"}}
        {{range $c := .app.status.conditions}}
            * {{$c.message}}
        {{end}}
        {{end}}
      slack:
        attachments: |
          [{
            "author_name": "{{(call .strings.ToUpper .app.metadata.name)}}",
            "author_link": "https://{{.context.argocdUrl}}/applications/{{.app.metadata.name}}",
            "color": "#E96D76",
            "fields": [
            {
              "title": "Sync Status",
              "value": "{{.app.status.sync.status}}",
              "short": true
            },
            {
              "title": {{- if .app.spec.source }} "Repository" {{- else if .app.spec.sources }} "Repositories" {{- end }},
              "value": {{- if .app.spec.source }} ":arrow_heading_up: {{ .app.spec.source.repoURL }}" {{- else if .app.spec.sources }} "{{- range $index, $source := .app.spec.sources }}{{ if $index }}\n{{ end }}:arrow_heading_up: {{ $source.repoURL }}{{- end }}" {{- end }},
              "short": true
            }
            {{range $index, $c := .app.status.conditions}}
            ,
            {
              "title": "{{$c.type}}",
              "value": "{{$c.message}}",
              "short": true
            }
            {{end}}
            ]
          }]
        deliveryPolicy: Post
        notifyBroadcast: false
    template.app-sync-succeeded: |
      message: |
        {{if eq .serviceType "slack"}}:white_check_mark:{{end}} Application *{{(call .strings.ToUpper .app.metadata.name)}}* has been successfully synced at {{.app.status.operationState.finishedAt}}.
        Sync operation details are available at: {{.context.argocdUrl}}/applications/{{.app.metadata.name}}?operation=true .
      slack:
        attachments: |
          [{
            "author_name": "{{(call .strings.ToUpper .app.metadata.name)}}",
            "author_link": "https://{{.context.argocdUrl}}/applications/{{.app.metadata.name}}",
            "color": "#18be52",
            "fields": [
            {
              "title": "Sync Status",
              "value": "{{.app.status.sync.status}}",
              "short": true
            },
            {
              "title": {{- if .app.spec.source }} "Repository" {{- else if .app.spec.sources }} "Repositories" {{- end }},
              "value": {{- if .app.spec.source }} ":arrow_heading_up: {{ .app.spec.source.repoURL }}" {{- else if .app.spec.sources }} "{{- range $index, $source := .app.spec.sources }}{{ if $index }}\n{{ end }}:arrow_heading_up: {{ $source.repoURL }}{{- end }}" {{- end }},
              "short": true
            }
            {{range $index, $c := .app.status.conditions}}
            ,
            {
              "title": "{{$c.type}}",
              "value": "{{$c.message}}",
              "short": true
            }
            {{end}}
            ]
          }]
        deliveryPolicy: Post
        notifyBroadcast: false

  # -- Conditions when the notifications should be sent
  triggers:
    trigger.on-created: |
      - description: Application is created.
        oncePer: app.metadata.name
        send:
        - app-created
        when: "true"
    trigger.on-deleted: |
      - description: Application is deleted.
        oncePer: app.metadata.name
        send:
        - app-deleted
        when: app.metadata.deletionTimestamp != nil
    trigger.on-deployed: |
      - description: Application is synced and healthy. Triggered once per commit.
        oncePer: app.status.operationState.syncResult.revision
        send:
        - app-deployed
        when: app.status.operationState != nil and app.status.operationState.phase in ['Succeeded']
          and app.status.health.status == 'Healthy'
    trigger.on-health-degraded: |
      - description: Application has degraded
        send:
        - app-health-degraded
        when: app.status.health.status == 'Degraded'
    trigger.on-sync-failed: |
      - description: Application syncing has failed
        send:
        - app-sync-failed
        when: app.status.operationState != nil and app.status.operationState.phase in ['Error',
          'Failed']
    trigger.on-sync-running: |
      - description: Application is being synced
        send:
        - app-sync-running
        when: app.status.operationState != nil and app.status.operationState.phase in ['Running']
    trigger.on-sync-status-unknown: |
      - description: Application status is 'Unknown'
        send:
        - app-sync-status-unknown
        when: app.status.sync.status == 'Unknown'
    trigger.on-sync-succeeded: |
      - description: Application syncing has succeeded
        send:
        - app-sync-succeeded
        when: app.status.operationState != nil and app.status.operationState.phase in ['Succeeded']
