# Upstream kubernetes-sigs chart, not Bitnami. Bitnami retracted its free
# public images from Docker Hub in 2025 (`docker.io/bitnami/external-dns` is
# gone entirely, including `:latest`) and moved the maintained ones behind a
# subscription, so the wrapper chart installs an image that does not exist.
# This is the chart the external-dns maintainers publish, which is the
# canonical source anyway — the image now defaults to registry.k8s.io and
# needs no override.
#
# Schema notes vs the Bitnami values this replaces: `zoneIdFilters` and
# `aws.zoneType` have no top-level equivalent upstream and move into
# `extraArgs` (rendered as `--<key>=<value>`); `dryRun: false` is the default
# and is gone. Everything else keeps the same key and meaning.

# K8s resources type to be observed for new DNS entries by ExternalDNS
# (e.g. ingress, service, gateway-httproute — Gateway API support requires
#  external-dns >= 0.13)
sources:
%{ for src in sources ~}
  - ${src}
%{ endfor ~}
# DNS provider where the DNS records will be created
provider: aws
# Limit possible target zones by domain suffixes (optional)
domainFilters:
  - ${filteredDomain}
%{ if length(excludeDomains) > 0 ~}
# Domain suffixes to exclude from `domainFilters` above. Needed because the
# private base domain is a subdomain of the public one: without this, the
# public release's `binbash.com.ar` filter also matches every private hostname
# under `aws.binbash.com.ar` and would publish internal records (pointing at an
# internal NLB) into the public zone.
excludeDomains:
%{ for domain in excludeDomains ~}
  - ${domain}
%{ endfor ~}
%{ endif ~}
# Modify how DNS records are synchronized between sources and providers (options: sync, upsert-only)
policy: sync
# Registry Type. Available types are: txt, noop
## ref: https://github.com/kubernetes-sigs/external-dns/blob/master/docs/proposal/registry.md
registry: txt
# TXT Registry Identifier. Keep this stable across chart migrations: the
# ownership TXT records already in the zone are keyed on it, and changing it
# makes every existing record look like another controller's.
txtOwnerId: ${txtOwnerId}
%{ if annotationFilter != "" ~}
# Filter sources managed by external-dns via annotation using label selector semantics (optional).
# Note: applies across all sources — when a release watches both `ingress` and
# `gateway-httproute`, an Ingress-class-based filter would silently exclude
# all HTTPRoutes. Leave empty in that case and rely on `domainFilters`.
annotationFilter: ${annotationFilter}
%{ endif ~}

# Adjust the interval for DNS updates
interval: 3m

# Flags with no top-level value upstream. `zone-id-filter` limits the target
# zones by id and `aws-zone-type` by public/private, the same two knobs the
# Bitnami chart exposed as `zoneIdFilters` and `aws.zoneType`.
extraArgs:
  zone-id-filter: ${filteredZoneId}
  aws-zone-type: ${zoneType}

# Create a service account and tie it to the external-dns role. The name is
# pinned because the IRSA trust policy in the `identities` layer conditions on
# `system:serviceaccount:externaldns:<name>`.
serviceAccount:
  create: true
  name: ${serviceAccountName}
  annotations:
    eks.amazonaws.com/role-arn: ${roleArn}
