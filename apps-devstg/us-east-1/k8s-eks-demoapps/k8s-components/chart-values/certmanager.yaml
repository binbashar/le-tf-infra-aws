# Install cert-manager CRDs via Helm as well
installCRDs: true

# Set log level
global:
  logLevel: 2

# Be explicit about where cluster resources are meant to be found
# e.g. ClusterIssuer and corresponding secrets
clusterResourceNamespace: certmanager

# Use Google's DNSs
podDnsPolicy: "None"
podDnsConfig:
  nameservers:
    - "8.8.8.8"
    - "1.1.1.1"

# Pod Security Context
securityContext:
  enabled: "true"

# We'll use a feature of EKS called IAM roles for service accounts
serviceAccount:
  create: true
  name: certmanager
  annotations:
    eks.amazonaws.com/role-arn: ${roleArn}

# The post-install API sanity-check job. It used to be disabled because it ran
# as a Job with no scheduling hints and got stuck in Pending: the apps node hits
# pod-density limits and the tools node carries a `stack: tools` taint. Giving
# it the same nodeSelector/tolerations every other platform component gets is
# what the previous comment implied and never did — the chart exposes both keys.
# cert-manager works without it, so this buys a fail-fast signal on a webhook
# that is not answering yet, not functionality.
#
# Note the chart declares the Job as `helm.sh/hook: post-install` with no
# `post-upgrade`: flipping this to true on a release that already exists does
# nothing until the next fresh install. Verified 2026-08-28 by applying the
# rendered hook (`helm get hooks`) by hand — it landed on the tools node and
# exited with "The cert-manager API is ready".
startupapicheck:
  enabled: true
  nodeSelector: ${nodeSelector}
  tolerations: ${tolerations}
