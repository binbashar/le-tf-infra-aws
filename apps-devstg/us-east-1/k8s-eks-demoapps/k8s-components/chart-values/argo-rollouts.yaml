# ---------------------------------------------------------
# Controller configs
# ---------------------------------------------------------
controller:
  nodeSelector: ${nodeSelector}
  tolerations: ${tolerations}

# ---------------------------------------------------------
# Dashboard configs
# ---------------------------------------------------------
dashboard:
  enabled: ${enableDashboard}

  nodeSelector: ${nodeSelector}
  tolerations: ${tolerations}

  # No Ingress. The dashboard is exposed at `rollouts.aws.binbash.com.ar` by
  # the `rollouts` row in networking-httproutes.tf; TLS comes from the
  # gateway's HTTPS listener.
  #
  # Two things from the old Ingress were dropped rather than translated:
  #   - `nginx.ingress.kubernetes.io/backend-protocol: HTTPS`. That was copied
  #     from argocd and was wrong here — the rollouts dashboard serves plain
  #     HTTP on 3100 and never had TLS to speak. It was harmless only because
  #     the component has been disabled.
  #   - `paths: [/rollouts]`. The dashboard serves from the root of its own
  #     hostname now, so there is no sub-path to carve out.
  ingress:
    enabled: false
