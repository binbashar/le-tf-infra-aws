#------------------------------------------------------------------------------
# Endpoints to monitor
#
# `endpoints`, not `services` — Gatus renamed the key upstream and v5 rejects
# the old one. The previous version of this file still used `services`, so it
# could not have worked against any recent Gatus; it survived because the
# component has been disabled.
#------------------------------------------------------------------------------
config:
  endpoints:
    - name: Binbash
      url: https://binbash.com.ar
      interval: 30s
      conditions:
        - "[STATUS] == 200"
      # alerts:
      #   - type: slack
      #     enabled: true
      #     description: "healthcheck failed 3 times in a row"
      #     send-on-resolved: true
    - name: Leverage
      url: https://leverage.binbash.com.ar
      interval: 30s
      conditions:
        - "[STATUS] == 200"
    # Dogfooding: the demo endpoint, reached the way the internet reaches it.
    # Exercises the public Envoy Gateway, its ALB and the wildcard cert every
    # interval. Note the request leaves the cluster and comes back in through
    # the internet-facing frontend, so its source address is the egress NAT
    # EIP, not a cluster address. That passes freely while the perimeter is
    # open (`open_to_internet = true`) and echo-server publishes its hostname
    # unrestricted. Close either one and this check needs the NAT EIP on that
    # allowlist — `envoy_gateway_public_allowed_cidrs` for the perimeter,
    # `echo_server_public_allowed_cidrs` for the route's own SecurityPolicy —
    # so if this endpoint is the only one red, check those before suspecting
    # the gateway.
    - name: Echo Server (public gateway)
      url: https://echo-server.binbash.com.ar
      interval: 60s
      conditions:
        - "[STATUS] == 200"

#------------------------------------------------------------------------------
# Alerting settings
#------------------------------------------------------------------------------
# alerting:
#   slack:
#     webhook-url: "https://hooks.slack.com/services/**********/**********/**********"

#------------------------------------------------------------------------------
# Exposure
#
# No Ingress. The chart's own `gateway.route` publishes
# `gatus.aws.binbash.com.ar` on the private Gateway, and that listener
# terminates TLS — so the cert-manager Certificate and the hardcoded
# `private-apps` ingress class that used to live here are both gone.
#
# Using the chart's key rather than a hand-written `kubernetes_manifest` is
# what the review asked for, and it is strictly better here: the object it
# renders is identical (same name, same hostname, same :80 backend) and Helm
# applies it server-side, so it does not need the Gateway API CRDs registered
# at plan time.
#------------------------------------------------------------------------------
ingress:
  enabled: false

gateway:
  route:
    enabled: true
    parentRefs: ${parentRefs}
    hosts:
      - ${host}

#------------------------------------------------------------------------------
# Scheduling: tools node group, same as every other platform component.
#------------------------------------------------------------------------------
nodeSelector: ${nodeSelector}
tolerations: ${tolerations}
