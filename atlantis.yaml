version: 3

# Auto-merge the PR after all plans have been successfully applied
automerge: true
# Remove the source branch upon merging
delete_source_branch_on_merge: true

# This allows Atlantis to autodiscover projects, however it should also honor
# explicit definitions under the projects key
autodiscover:
  mode: "enabled"
  ignore_paths:
  - config/*
  # Test fixtures for @bin/scripts/version_support - .tf files on purpose, but not
  # layers. Must end in /** not /*: Atlantis matches with doublestar globs where a
  # single * does not cross a "/", and it checks each discovered directory by its full
  # path with no parent-matched-so-skip-the-subtree shortcut. The fixture layers are
  # nine segments deep, so a single-star glob would miss every one of them.
  # Quoted because '@' is a reserved YAML indicator: unquoted, this line fails to parse.
  - '@bin/scripts/**'
  # TEMPORARY self-test layer - reverted right after the CI run that proves the gate fails.
  - '_version-support-selftest/**'

# Here we define the projects (or layers) explicitly
projects:
- name: test
  dir: shared/us-east-1/base-tf-backend
  # Not sure what this does, I had to install tofy on the server anyway
  terraform_distribution: opentofu
  # Same as above, not sure if this is doing anything
  terraform_version: 1.6.6
  # workflow: default
  # delete_source_branch_on_merge: false
